<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sleep Timer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        sp: {
          black:  '#0a0a0a',
          dark:   '#121212',
          card:   '#181818',
          hover:  '#282828',
          border: '#2a2a2a',
          green:  '#1DB954',
          glight: '#1ed760',
          gray:   '#b3b3b3',
          light:  '#e0e0e0',
          white:  '#ffffff',
        }
      },
      fontFamily: { sans: ['Circular', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'] },
      animation: {
        'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
        'spin-slow': 'spin 8s linear infinite',
      }
    }
  }
}
</script>
<style>
  * { -webkit-app-region: no-drag; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; user-select: none; }
  .drag { -webkit-app-region: drag; }
  .no-drag { -webkit-app-region: no-drag; }

  @keyframes orbit {
    from { transform: rotate(0deg) translateX(54px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(54px) rotate(-360deg); }
  }
  @keyframes orbitslow {
    from { transform: rotate(0deg) translateX(80px) rotate(0deg); }
    to   { transform: rotate(-360deg) translateX(80px) rotate(360deg); }
  }
  @keyframes pulse-ring {
    0%   { transform: scale(0.85); opacity: 0.6; }
    50%  { transform: scale(1.1); opacity: 0.15; }
    100% { transform: scale(0.85); opacity: 0.6; }
  }
  @keyframes glowpulse {
    0%, 100% { box-shadow: 0 0 24px 4px #1DB95455; }
    50%       { box-shadow: 0 0 48px 12px #1DB95422; }
  }
  @keyframes barwave {
    0%,100% { height: 4px; }
    50%      { height: 18px; }
  }

  .orbit-dot {
    position: absolute; width: 8px; height: 8px;
    border-radius: 50%; top: 50%; left: 50%;
    margin-top: -4px; margin-left: -4px;
  }
  .orbit-dot.d1 { background: #1DB954; animation: orbit 4s linear infinite; }
  .orbit-dot.d2 { background: #ffffff33; animation: orbitslow 7s linear infinite; }

  .pulse-ring {
    position: absolute; inset: -12px; border-radius: 50%;
    border: 1.5px solid #1DB95444;
    animation: pulse-ring 3s ease-in-out infinite;
  }
  .pulse-ring-2 {
    position: absolute; inset: -26px; border-radius: 50%;
    border: 1px solid #1DB95422;
    animation: pulse-ring 3s ease-in-out infinite 1s;
  }

  .glow-btn { animation: glowpulse 2.5s ease-in-out infinite; }

  .bar { width: 3px; border-radius: 2px; background: #1DB954; display: inline-block; }
  .bar:nth-child(1) { animation: barwave 1.1s ease-in-out infinite 0s; }
  .bar:nth-child(2) { animation: barwave 1.1s ease-in-out infinite 0.2s; }
  .bar:nth-child(3) { animation: barwave 1.1s ease-in-out infinite 0.4s; }
  .bar:nth-child(4) { animation: barwave 1.1s ease-in-out infinite 0.15s; }
  .bar:nth-child(5) { animation: barwave 1.1s ease-in-out infinite 0.35s; }

  .progress-track { background: #333; border-radius: 2px; height: 4px; position: relative; cursor: pointer; }
  .progress-fill  { background: #1DB954; border-radius: 2px; height: 4px; transition: width 1s linear; }
  .progress-thumb {
    position: absolute; right: -5px; top: -4px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; opacity: 0; transition: opacity 0.15s;
  }
  .progress-track:hover .progress-thumb { opacity: 1; }

  .action-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid #333; background: transparent;
    color: #b3b3b3; font-size: 13px; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
  }
  .action-chip:hover { border-color: #555; color: #fff; }
  .action-chip.active { background: #1DB954; border-color: #1DB954; color: #000; font-weight: 600; }

  .preset-pill {
    padding: 5px 13px; border-radius: 20px;
    border: 1px solid #2a2a2a; background: #181818;
    color: #b3b3b3; font-size: 12px; cursor: pointer;
    transition: all 0.18s;
  }
  .preset-pill:hover { border-color: #555; color: #fff; background: #282828; }
  .preset-pill.active { background: #fff; border-color: #fff; color: #000; font-weight: 600; }

  .glass-card {
    background: rgba(24,24,24,0.96);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1DB954; color: #000; font-weight: 600; font-size: 13px;
    padding: 10px 20px; border-radius: 20px; opacity: 0;
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="w-screen h-screen flex items-center justify-center" style="background:transparent">

<div class="glass-card w-[400px] h-[590px] flex flex-col relative overflow-hidden" id="app-window">

  <!-- Ambient glow bg -->
  <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(ellipse 60% 40% at 50% 0%, #1DB95415 0%, transparent 70%)"></div>

  <!-- Titlebar -->
  <div class="drag flex items-center justify-between px-5 pt-4 pb-2">
    <div class="flex items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#1DB954"/><path d="M8 17V7l9 5-9 5z" fill="#000"/></svg>
      <span class="text-sp-gray text-xs font-medium tracking-widest uppercase">Sleep Timer</span>
    </div>
    <div class="no-drag flex items-center gap-2">
      <button onclick="minimizeApp()" class="w-7 h-7 rounded-full flex items-center justify-center text-sp-gray hover:text-white hover:bg-sp-hover transition-all text-lg leading-none">–</button>
      <button onclick="closeApp()" class="w-7 h-7 rounded-full flex items-center justify-center text-sp-gray hover:text-white hover:bg-red-900 transition-all">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col items-center px-6 pb-5 overflow-hidden">

    <!-- Visual orb -->
    <div class="relative flex items-center justify-center mt-2 mb-4" style="width:140px;height:140px">
      <div class="pulse-ring-2"></div>
      <div class="pulse-ring"></div>
      <div style="position:relative;width:110px;height:110px">
        <div class="orbit-dot d1"></div>
        <div class="orbit-dot d2"></div>
        <div class="w-full h-full rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#1a1a1a 0%,#111 100%);border:1.5px solid #1DB95433">
          <div id="orb-icon" class="transition-all duration-500">
            <!-- idle: moon -->
            <svg id="icon-idle" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="1.5" stroke-linecap="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <!-- running: wave bars -->
            <div id="icon-running" class="hidden flex items-end gap-[3px]" style="height:24px">
              <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <!-- done: check -->
            <svg id="icon-done" class="hidden" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Countdown -->
    <div id="countdown" class="text-5xl font-bold text-white tracking-tight mb-1 tabular-nums" style="font-variant-numeric:tabular-nums">00:00:00</div>
    <p id="status-label" class="text-sp-gray text-xs tracking-wide mb-4">escolha um horário</p>

    <!-- Progress bar -->
    <div class="w-full mb-5">
      <div class="progress-track w-full" id="prog-track">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
        <div class="progress-thumb" id="prog-thumb"></div>
      </div>
    </div>

    <!-- Presets -->
    <div class="flex gap-2 flex-wrap justify-center mb-4">
      <button class="preset-pill" onclick="setPreset(15)">15 min</button>
      <button class="preset-pill active" onclick="setPreset(30)">30 min</button>
      <button class="preset-pill" onclick="setPreset(60)">1 h</button>
      <button class="preset-pill" onclick="setPreset(90)">1h30</button>
      <button class="preset-pill" onclick="setPreset(120)">2 h</button>
    </div>

    <!-- Custom time -->
    <div class="flex items-center gap-2 mb-4 w-full justify-center">
      <span class="text-sp-gray text-xs">personalizado</span>
      <div class="flex items-center gap-1 bg-sp-hover rounded-lg px-3 py-1.5">
        <input id="inp-h" type="number" min="0" max="23" value="0"
          class="w-7 bg-transparent text-white text-sm font-semibold text-center outline-none"
          oninput="onCustom()" />
        <span class="text-sp-gray text-xs">h</span>
        <input id="inp-m" type="number" min="0" max="59" value="30"
          class="w-7 bg-transparent text-white text-sm font-semibold text-center outline-none"
          oninput="onCustom()" />
        <span class="text-sp-gray text-xs">m</span>
        <input id="inp-s" type="number" min="0" max="59" value="0"
          class="w-7 bg-transparent text-white text-sm font-semibold text-center outline-none"
          oninput="onCustom()" />
        <span class="text-sp-gray text-xs">s</span>
      </div>
    </div>

    <!-- Action chips -->
    <div class="flex gap-2 flex-wrap justify-center mb-5">
      <button class="action-chip active" id="chip-shutdown" onclick="setAction('shutdown')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        Desligar
      </button>
      <button class="action-chip" id="chip-restart" onclick="setAction('restart')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Reiniciar
      </button>
      <button class="action-chip" id="chip-sleep" onclick="setAction('sleep')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        Hibernar
      </button>
      <button class="action-chip" id="chip-logoff" onclick="setAction('logoff')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>

    <!-- Main action button -->
    <button id="main-btn" onclick="toggleTimer()"
      class="glow-btn w-full py-3.5 rounded-full font-bold text-sm tracking-wide transition-all duration-300 flex items-center justify-center gap-2"
      style="background:#1DB954;color:#000;">
      <svg id="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span id="btn-label">Iniciar</span>
    </button>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const { ipcRenderer } = require('electron');

let totalSeconds = 1800;
let remaining = 1800;
let action = 'shutdown';
let running = false;
let interval = null;

function pad(n) { return String(n).padStart(2,'0'); }
function toHMS(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return pad(h)+':'+pad(m)+':'+pad(sec);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setOrbState(state) {
  document.getElementById('icon-idle').classList.add('hidden');
  document.getElementById('icon-running').classList.add('hidden');
  document.getElementById('icon-done').classList.add('hidden');
  if (state === 'idle') document.getElementById('icon-idle').classList.remove('hidden');
  if (state === 'running') document.getElementById('icon-running').classList.remove('hidden');
  if (state === 'done') document.getElementById('icon-done').classList.remove('hidden');
}

function updateCountdown() {
  document.getElementById('countdown').textContent = toHMS(remaining);
}

function updateProgress() {
  const pct = totalSeconds > 0 ? Math.round((1 - remaining/totalSeconds)*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  const thumb = document.getElementById('prog-thumb');
  thumb.style.right = 'unset';
  thumb.style.left = 'calc(' + pct + '% - 6px)';
}

function setPreset(minutes) {
  if (running) return;
  totalSeconds = minutes * 60;
  remaining = totalSeconds;
  document.getElementById('inp-h').value = 0;
  document.getElementById('inp-m').value = minutes >= 60 ? Math.floor(minutes/60)*60 === minutes ? 0 : minutes%60 : minutes;
  document.getElementById('inp-h').value = Math.floor(minutes/60);
  document.getElementById('inp-m').value = minutes % 60;
  document.getElementById('inp-s').value = 0;
  document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  updateCountdown();
  updateProgress();
  gsap.from('#countdown', { scale: 1.12, duration: 0.35, ease: 'back.out(2)' });
}

function onCustom() {
  if (running) return;
  const h = parseInt(document.getElementById('inp-h').value)||0;
  const m = parseInt(document.getElementById('inp-m').value)||0;
  const s = parseInt(document.getElementById('inp-s').value)||0;
  totalSeconds = h*3600 + m*60 + s;
  remaining = totalSeconds;
  document.querySelectorAll('.preset-pill').forEach(b => b.classList.remove('active'));
  updateCountdown();
  updateProgress();
}

function setAction(a) {
  action = a;
  ['shutdown','restart','sleep','logoff'].forEach(id => {
    document.getElementById('chip-'+id).classList.toggle('active', id===a);
  });
}

function toggleTimer() {
  if (running) { cancelTimer(); return; }
  startTimer();
}

function startTimer() {
  if (totalSeconds < 1) { showToast('Defina um tempo primeiro!'); return; }
  running = true;
  remaining = totalSeconds;

  // Send to OS
  ipcRenderer.send('schedule-shutdown', { seconds: remaining, action });

  setOrbState('running');
  document.getElementById('status-label').textContent = 'agendado • ' + actionLabel();
  document.getElementById('btn-icon').innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  document.getElementById('btn-label').textContent = 'Cancelar';
  document.getElementById('main-btn').style.background = '#282828';
  document.getElementById('main-btn').style.color = '#fff';
  document.getElementById('main-btn').classList.remove('glow-btn');

  gsap.from('#app-window', { scale: 0.98, duration: 0.4, ease: 'back.out(1.5)' });

  interval = setInterval(() => {
    remaining--;
    updateCountdown();
    updateProgress();
    if (remaining <= 0) {
      clearInterval(interval);
      running = false;
      setOrbState('done');
      document.getElementById('status-label').textContent = 'tempo esgotado!';
      document.getElementById('btn-icon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
      document.getElementById('btn-label').textContent = 'Reiniciar';
      document.getElementById('main-btn').style.background = '#1DB954';
      document.getElementById('main-btn').style.color = '#000';
      document.getElementById('main-btn').classList.add('glow-btn');
    }
  }, 1000);
}

function cancelTimer() {
  clearInterval(interval);
  running = false;
  remaining = totalSeconds;
  ipcRenderer.send('cancel-shutdown');
  setOrbState('idle');
  updateCountdown();
  updateProgress();
  document.getElementById('status-label').textContent = 'cancelado';
  document.getElementById('btn-icon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
  document.getElementById('btn-label').textContent = 'Iniciar';
  document.getElementById('main-btn').style.background = '#1DB954';
  document.getElementById('main-btn').style.color = '#000';
  document.getElementById('main-btn').classList.add('glow-btn');
  showToast('Timer cancelado');
  gsap.from('#countdown', { opacity: 0, y: -8, duration: 0.4 });
}

function actionLabel() {
  return { shutdown:'desligar', restart:'reiniciar', sleep:'hibernar', logoff:'sair da conta' }[action];
}

ipcRenderer.on('shutdown-result', (e, data) => {
  if (!data.success) { showToast('Erro: ' + data.error); cancelTimer(); }
  else showToast('Agendado para ' + actionLabel() + ' em ' + toHMS(totalSeconds));
});
ipcRenderer.on('cancel-result', (e, data) => {
  if (!data.success) showToast('Não havia nada para cancelar');
});

function minimizeApp() { ipcRenderer.send('minimize-app'); }
function closeApp()    { ipcRenderer.send('close-app'); }

// Init
updateCountdown();
updateProgress();

// Entry animation
gsap.from('#app-window', { opacity: 0, scale: 0.94, y: 20, duration: 0.6, ease: 'back.out(1.4)' });
</script>
</body>
</html>
